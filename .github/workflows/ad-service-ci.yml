name: ad-service CI

on:
 push: 
    branches: ['main']
    paths: 
        - 'src/ad-service/**'

 pull_request: 
    branches: ['main']
    paths: 
        - 'src/ad-service/**'

jobs:
    Build:
      runs-on: ubuntu-latest
      steps:
             # Checkout the repository
        - name: Checkout code
          uses: actions/checkout@v4

              # Set up JDK
        - name: Setup JDK
          uses: actions/setup-java@v5
          with:
            distribution: 'temurin' 
            java-version: '21'
             
              #setup build tool gradle
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v6

        - name: Build with Gradle
          working-directory: src/ad-service
          run: |
               ./gradlew build -PprotoSourceDir=${{ github.workspace }}/src/ad-service/pb \
               -x verifyGoogleJavaFormat \
               -x checkstyleMain

        - name: Setup unit tests and coverage
          working-directory: src/ad-service
          run: ./gradlew clean test jacocoTestReport -PprotoSourceDir=${{ github.workspace }}/src/ad-service/pb

        - name: Upload test coverage report
          uses: actions/upload-artifact@v4
          with:
            name: jacoco report   #java code coverage report
            path: src/ad-service/build/reports/jacoco/test/html

    Code-Quality-Check:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup JDK
          uses: actions/setup-java@v5
          with:
            distribution: 'temurin' 
            java-version: '21'

        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v6

        - name: Java linting
          working-directory: src/ad-service
          continue-on-error: true
          run: ./gradlew check -PprotoSourceDir=${{ github.workspace }}/src/ad-service/pb


    Docker-Build:
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write

      needs:
        - Build
        - Code-Quality-Check
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Login ghcr.io
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        
        - name: Setup Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Build image locally
          uses: docker/build-push-action@v5
          with:
            context: src/ad-service
            load: true # load image to local daemon
            tags: ad-service:${{ github.sha }}

        - name: Run trivy vulnerability scan on local image
          uses: aquasecurity/trivy-action@0.28.0
          with:
            image-ref: ad-service:${{ github.sha }}
            format: 'table'
            exit-code: '1'
            severity: 'CRITICAL,HIGH'

        - name: Build and push
          uses: docker/build-push-action@v5
          with:
            context: src/ad-service
            push: true  
            tags: ghcr.io/${{ github.repository_owner }}/ad-service:${{ github.sha }}

    Update-K8s-manifests:
      runs-on: ubuntu-latest
      needs:
        - Docker-Build
      
      steps:

        - name: Checkout code
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.GITHUB_TOKEN }}

        - name: update k8s deployment
          run: |
                sed -i "s|image:.*|image: ghcr.io/${{ github.repository_owner }}/ad-service:${{ github.sha }}|g" kubernetes/ad/deploy.yaml

        - name: git commit and push
          run: |
                git config --global user.email "aneenamathew712@gmail.com"
                git config --global user.name "aneena mathew"
                git add kubernetes/ad/deploy.yaml
                git commit -m "[CI]: Update ad-service image tag" || echo "No changes to commit"
                git push -u origin main
                


        