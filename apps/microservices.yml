apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-account
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/aneenamathew123/Cloud-native-microservices-DevOps.git
    targetRevision: main
    path: kubernetes-manifests/  
    directory:
      include: "service-account.yml"
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-demo                         
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices
  namespace: argocd
  annotations:
     argocd.argoproj.io/sync-wave: "1" 
spec:
  project: default
  source:
    repoURL: https://github.com/aneenamathew123/Cloud-native-microservices-DevOps.git
    targetRevision: main
    path: kubernetes-manifests/  
    directory:
      include: "Microservices-deployment.yml"
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-demo                         
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
