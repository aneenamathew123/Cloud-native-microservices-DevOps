apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-recommendationservice
  labels:
    opentelemetry.io/name: opentelemetry-demo-recommendationservice
    app.kubernetes.io/name: opentelemetry-demo-recommendationservice
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: recommendationservice
    app.kubernetes.io/part-of: opentelemetry-demo

spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  
      maxSurge: 1
  selector:
    matchLabels: 
      app.kubernetes.io/name: opentelemetry-demo-recommendationservice
  template:
    metadata:
      labels:
        opentelemetry.io/name: opentelemetry-demo-recommendationservice
        app.kubernetes.io/name: opentelemetry-demo-recommendationservice
        app.kubernetes.io/instance: opentelemetry-demo
        app.kubernetes.io/component: recommendationservice

    spec:
      serviceAccountName: opentelemetry-demo
      containers:
      - name: recommendationservice
        image: 'ghcr.io/open-telemetry/demo:1.12.0-recommendationservice'
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 1010
          name: service
        env:
        - name: OTEL_SERVICE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['app.kubernetes.io/name']
        - name: RECOMMENDATION_PORT
          value: "1010"
        - name: PRODUCT_CATALOG_ADDR
          value: opentelemetry-demo-product-catalog:8088
        - name: FLAGD_HOST
          value: flagd
        - name: FLAGD_PORT
          value: "8013"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector:4317
        - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
          value: cumulative
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.name=${OTEL_SERVICE_NAME},service.namespace=opentelemetry-demo
        
        resources:
          requests:
            memory: "500Mi"
          limits:
            memory: "1000Mi"
        
